<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGradient)"/>
  
  <!-- Stylized T letter -->
  <path d="M136 128 L376 128 L376 176 L280 176 L280 384 L232 384 L232 176 L136 176 Z" fill="white"/>
  
  <!-- Leaf/growth accent on top right of T -->
  <path d="M340 100 Q400 80 420 140 Q400 120 360 130 Q380 160 360 200 Q340 160 340 100 Z" fill="url(#leafGradient)" opacity="0.95"/>
  
  <!-- Small sparkle dots -->
  <circle cx="400" cy="220" r="8" fill="white" opacity="0.8"/>
  <circle cx="120" cy="300" r="6" fill="white" opacity="0.6"/>
  <circle cx="390" cy="340" r="5" fill="white" opacity="0.5"/>
</svg>
